<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OQIM — Pay for views. Not estimates.">
  <defs>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffa8f2"/>
      <stop offset="100%" stop-color="#ac459d"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ac459d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ac459d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#aa94ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#aa94ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffa8f2" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffa8f2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streamA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffa8f2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffa8f2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffa8f2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streamB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#aa94ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#aa94ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#aa94ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streamC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ac459d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ac459d" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ac459d" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1200" height="400" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#1c1917"/>

    <!-- ambient glows -->
    <ellipse cx="180" cy="60" rx="420" ry="260" fill="url(#glowPink)"/>
    <ellipse cx="1080" cy="360" rx="460" ry="280" fill="url(#glowPurple)"/>
    <ellipse cx="620" cy="200" rx="520" ry="240" fill="url(#glowSoft)" opacity="0.5"/>

    <!-- flowing streams (oqim = "stream") -->
    <path d="M-40 300 C 240 260, 420 340, 700 300 S 1120 250, 1260 290" stroke="url(#streamA)" stroke-width="2" fill="none"/>
    <path d="M-40 325 C 260 285, 440 365, 720 325 S 1140 275, 1260 315" stroke="url(#streamB)" stroke-width="1.5" fill="none"/>
    <path d="M-40 350 C 280 310, 460 385, 740 350 S 1160 300, 1260 340" stroke="url(#streamC)" stroke-width="1.5" fill="none"/>

    <!-- dotted view-count sparkline -->
    <g fill="#ffa8f2">
      <circle cx="880" cy="128" r="3" opacity="0.35"/>
      <circle cx="920" cy="118" r="3" opacity="0.45"/>
      <circle cx="960" cy="122" r="3" opacity="0.55"/>
      <circle cx="1000" cy="104" r="3" opacity="0.65"/>
      <circle cx="1040" cy="92" r="3.5" opacity="0.8"/>
      <circle cx="1080" cy="72" r="4" opacity="1"/>
    </g>
    <path d="M880 128 L920 118 L960 122 L1000 104 L1040 92 L1080 72" stroke="#ffa8f2" stroke-opacity="0.3" stroke-width="1.5" fill="none"/>

    <!-- wordmark -->
    <text x="96" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="112" font-weight="800" letter-spacing="6" fill="url(#wordmark)">OQIM</text>

    <!-- tagline -->
    <text x="100" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#f4f4f3">Pay for views. Not estimates.</text>
    <text x="100" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#d0cac6">The UGC platform connecting brands with verified Instagram Reels creators.</text>

    <!-- feature chips -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
      <rect x="98" y="312" width="150" height="34" rx="17" fill="#ffa8f2" fill-opacity="0.1" stroke="#ffa8f2" stroke-opacity="0.35"/>
      <text x="173" y="334" text-anchor="middle" fill="#ffa8f2">Verified views</text>

      <rect x="260" y="312" width="182" height="34" rx="17" fill="#aa94ff" fill-opacity="0.1" stroke="#aa94ff" stroke-opacity="0.35"/>
      <text x="351" y="334" text-anchor="middle" fill="#aa94ff">Transparent payouts</text>

      <rect x="454" y="312" width="164" height="34" rx="17" fill="#9ef483" fill-opacity="0.1" stroke="#9ef483" stroke-opacity="0.35"/>
      <text x="536" y="334" text-anchor="middle" fill="#9ef483">CPM pricing</text>
    </g>

    <!-- subtle border -->
    <rect x="0.5" y="0.5" width="1199" height="399" rx="15.5" stroke="#ffa8f2" stroke-opacity="0.15" fill="none"/>
  </g>
</svg>
